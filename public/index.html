<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast Quiz</title>
<style>
  :root { --bg:#14161c; --panel:#1f222b; --text:#eceef3; --muted:#8b91a1; --accent:#f5c518; --ok:#3ecf8e; --bad:#ef5b5b; }
  * { box-sizing: border-box; }
  html { scroll-padding-bottom:110px; } /* centering ignores the area hidden by the pinned guess bar */
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 24px; font-size:22px; font-weight:700; border-bottom:1px solid #2b2f3a; }
  header span { color:var(--accent); }
  .hidden { display:none !important; }
  #login { max-width:360px; margin:15vh auto; background:var(--panel); padding:28px; border-radius:12px; text-align:center; }
  input, button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid #3a3f4d; background:#12141a; color:var(--text); }
  button { background:var(--accent); color:#111; border:none; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #login input { width:100%; margin:14px 0; }
  #login .err { color:var(--bad); min-height:1.2em; }
  #game { display:grid; grid-template-columns: 1fr 280px; gap:20px; padding:20px 24px; max-width:1100px; margin:auto; }
  .panel { background:var(--panel); border-radius:12px; padding:18px; }
  #stage h2 { margin:0 0 4px; }
  #stage .sub { color:var(--muted); margin-bottom:16px; }
  #actors { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap:10px; align-content:start; min-height:200px; }
  .actor { min-width:0; overflow-wrap:anywhere; padding:12px 16px; border-radius:8px; background:#2a2e3a; font-size:20px; animation: pop .35s ease-out; display:flex; align-items:center; gap:12px; }
  .actor small { margin-right:0 !important; }
  .actor .photo { width:150px; height:225px; flex:none; border-radius:8px; background:#1a1d25; object-fit:cover; }
  .actor small { color:var(--muted); margin-right:10px; }
  .actor.pending { background:transparent; border:1px dashed #3a3f4d; color:var(--muted); font-size:15px; animation:none; }
  @keyframes pop { from { transform:scale(.9); opacity:0 } to { transform:none; opacity:1 } }
  #bar { height:6px; background:#2a2e3a; border-radius:3px; margin:16px 0; overflow:hidden; }
  #bar div { height:100%; background:var(--accent); width:0; }
  #solution { font-size:28px; font-weight:700; color:var(--accent); text-align:center; padding:14px; }
  #solution .also { font-size:17px; font-weight:500; color:var(--muted); font-style:italic; margin-top:4px; }
  #solution img { display:block; margin:12px auto 0; max-height:260px; border-radius:8px; box-shadow:0 6px 24px #0008; }
  /* Stays pinned to the bottom of the window while the actor list scrolls. */
  #guessbar { position:sticky; bottom:0; z-index:1; margin:16px -18px -18px; padding:2px 18px 12px; background:var(--panel); border-radius:0 0 12px 12px; box-shadow:0 -8px 16px -8px #0009; }
  #guessbar #bar { margin:0 0 12px; }
  #guessForm { display:flex; gap:10px; }
  #guessForm input { flex:1; }
  #result { min-height:1.4em; margin-top:8px; font-weight:600; }
  #result.ok { color:var(--ok); } #result.bad { color:var(--bad); }
  #source { margin-top:10px; text-align:right; font-size:12px; color:var(--muted); opacity:.6; }
  #source a { color:inherit; }
  h3 { margin:0 0 10px; font-size:15px; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; }
  ol, ul { margin:0; padding-left:20px; }
  #scores li { padding:4px 0; display:flex; justify-content:space-between; }
  #scores li.me { color:var(--accent); }
  #scores li.off { opacity:.4; }
  #scores li .found { color:var(--ok); }
  #finders li { padding:2px 0; }
  #feed { list-style:none; padding:0; max-height:220px; overflow-y:auto; font-size:14px; color:var(--muted); }
  #feed li { padding:3px 0; border-bottom:1px solid #2a2e3a; }
  aside { display:flex; flex-direction:column; gap:20px; }
  @media (max-width:800px) { #game { grid-template-columns:minmax(0, 1fr); padding:12px; } }
</style>
</head>
<body>
<header>🎬 Cast <span>Quiz</span></header>

<form id="login">
  <h2>Who's in the cast?</h2>
  <p style="color:var(--muted)">An actor is revealed every 10 seconds. Find the movie or TV show first to score the most points (10, 9, 8…).</p>
  <input id="name" placeholder="Your name" maxlength="20" autofocus>
  <button>Join the game</button>
  <div class="err" id="loginErr"></div>
</form>

<main id="game" class="hidden">
  <section>
    <div class="panel" id="stage">
      <h2 id="title">Waiting for players…</h2>
      <div class="sub" id="subtitle"></div>
      <div id="solution" class="hidden"></div>
      <div id="actors"></div>
      <div id="source"></div>
      <div id="guessbar">
        <div id="bar"><div></div></div>
        <form id="guessForm">
          <input id="guess" placeholder="Type the movie / TV show title…" autocomplete="off">
          <button>Guess</button>
        </form>
        <div id="result"></div>
      </div>
    </div>
  </section>
  <aside>
    <div class="panel"><h3>Scoreboard</h3><ol id="scores"></ol></div>
    <div class="panel"><h3>Found this round</h3><ol id="finders"></ol></div>
    <div class="panel"><h3>Activity</h3><ul id="feed"></ul></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let me = JSON.parse(sessionStorage.getItem('castquiz') || 'null');
let state = null;
let clockOffset = 0;
let lastRound = 0;
let lastPhase = null;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function join(name) {
  const res = await fetch('/join', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, id: me?.id }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);
  me = data;
  sessionStorage.setItem('castquiz', JSON.stringify(me));
  connect();
}

function connect() {
  $('login').classList.add('hidden');
  $('game').classList.remove('hidden');
  const es = new EventSource('/events?id=' + encodeURIComponent(me.id));
  es.addEventListener('state', (e) => render(JSON.parse(e.data)));
  es.addEventListener('feed', (e) => {
    const li = el('li', JSON.parse(e.data).text);
    $('feed').prepend(li);
  });
  es.onerror = () => {
    // Connection lost: rejoin (keeps the score if the server still knows us) and reconnect.
    es.close();
    setTimeout(() => join(me.name).catch(() => setTimeout(() => es.onerror(), 2000)), 1500);
  };
  $('guess').focus();
}

function render(s) {
  state = s;
  clockOffset = s.serverNow - Date.now();
  const myself = s.players.find((p) => p.name === me.name);
  const kind = s.type === 'tv' ? 'TV show' : 'movie';

  if (s.round !== lastRound) {        // new round: reset the guess area
    lastRound = s.round;
    $('result').textContent = '';
    $('result').className = '';
    $('guess').value = '';
  }

  if (s.phase === 'waiting') {
    $('title').textContent = 'Waiting for players…';
    $('subtitle').textContent = '';
  } else if (s.phase === 'loading') {
    $('title').textContent = 'Picking the next title…';
    $('subtitle').textContent = '';
  } else {
    $('title').textContent = `Round ${s.round} — guess the ${kind}` + (s.year ? ` from ${s.year}` : '');
    $('subtitle').textContent = s.phase === 'playing'
      ? `Actor ${s.actors.length} of ${s.totalActors} · a new actor every ${s.hintMs / 1000}s`
      : 'Round over — next one starting soon…';
  }

  const newActor = renderActors(s);

  const source = $('source');
  if (s.source === 'tmdb') {
    const link = el('a', 'TMDb');
    link.href = 'https://www.themoviedb.org';
    link.target = '_blank';
    link.rel = 'noopener';
    source.replaceChildren('Data: ', link);
  } else {
    source.textContent = s.source === 'local' ? 'Data: local list' : '';
  }

  $('solution').classList.toggle('hidden', s.phase !== 'reveal');
  if (s.phase === 'reveal') {
    $('solution').textContent = s.year ? `${s.solution} (${s.year})` : s.solution;
    if (s.otherTitles?.length) $('solution').append(el('div', s.otherTitles[0], 'also'));
    if (s.poster) {
      const img = el('img');
      img.src = s.poster;
      img.alt = '';
      img.onerror = () => img.remove();
      img.onload = () => center($('solution')); // its height changes once the poster has loaded
      $('solution').append(img);
    }
  }

  // Keep the action in view: the newest actor while playing, the answer when the round ends.
  if (s.phase === 'playing' && newActor) center(newActor);
  else if (s.phase === 'reveal' && lastPhase !== 'reveal') center($('solution'));
  lastPhase = s.phase;

  const canGuess = s.phase === 'playing' && !myself?.found;
  $('guess').disabled = !canGuess;
  $('guessForm').querySelector('button').disabled = !canGuess;
  if (canGuess) $('guess').focus();

  const scores = $('scores');
  scores.replaceChildren();
  for (const p of s.players) {
    const li = el('li', null, (p.name === me.name ? 'me ' : '') + (p.online ? '' : 'off'));
    const left = el('span', p.name);
    if (p.found && s.phase === 'playing') left.append(el('span', ' ✔', 'found'));
    li.append(left, el('b', String(p.score)));
    scores.append(li);
  }

  const finders = $('finders');
  finders.replaceChildren(...s.finders.map((f) => el('li', `${f.name} (+${f.points})`)));
}

// Updates the actor list in place, so revealed rows and photos don't reload or re-animate.
function renderActors(s) {
  const list = $('actors');
  list.querySelectorAll('.pending').forEach((p) => p.remove());
  if (list.dataset.round !== String(s.round) || list.children.length > s.actors.length) {
    list.replaceChildren();
    list.dataset.round = s.round;
  }
  const rows = list.children;
  let added = null;
  s.actors.forEach((a, i) => {
    let row = rows[i];
    if (!row) {
      added = row = el('div', null, 'actor');
      if (a.photo) {
        const img = el('img', null, 'photo');
        img.src = a.photo;
        img.alt = '';
        img.onerror = () => img.remove();
        row.append(img);
      }
      row.append(el('small', `#${i + 1}`), a.name);
      list.append(row);
    }
  });
  for (let i = s.actors.length; s.phase !== 'loading' && i < s.totalActors; i++) {
    list.append(el('div', `Actor #${i + 1} — hidden`, 'actor pending'));
  }
  return added; // the newest row added by this update, if any
}

// Brings an element to the middle of the window (or as close as the page allows).
function center(elem) {
  elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function tick() {
  const bar = $('bar').firstElementChild;
  if (state?.nextAt) {
    const total = state.phase === 'playing' ? state.hintMs : state.nextAt - (state.serverNow);
    const left = state.nextAt - (Date.now() + clockOffset);
    bar.style.width = Math.max(0, Math.min(100, 100 * (1 - left / total))) + '%';
  } else {
    bar.style.width = '0';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  try { await join($('name').value.trim()); }
  catch (err) { $('loginErr').textContent = err.message; }
});

$('guessForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('guess').value.trim();
  if (!text) return;
  const res = await fetch('/guess', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: me.id, text }),
  });
  const r = await res.json();
  const out = $('result');
  if (r.status === 'correct') { out.textContent = `✅ Correct! "${r.title}" — +${r.points} points`; out.className = 'ok'; }
  else if (r.status === 'wrong') { out.textContent = `❌ "${text}" is not it…`; out.className = 'bad'; $('guess').select(); }
  else if (r.status === 'closed') { out.textContent = 'Round is over.'; out.className = ''; }
});

if (me) connect();
</script>
</body>
</html>
